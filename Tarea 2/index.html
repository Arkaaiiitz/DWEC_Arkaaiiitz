<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de multiplicar</title>
    <script src="js/tablaMultiplicar.js"></script>
    <script src="js/tablaDividir.js"></script>
</head>
<body>
    <h1>Tabla de multiplicar</h1>
    <form onsubmit="mostrarTablaMultiplicar(event)">
        <label for="numero">Introduce el número:</label>
        <input id="numero" type="number" required />
        <input type="submit" value="Mostrar tabla (Multiplicación)" />
    </form>
    <form onsubmit="mostrarTablaDividir(event)">
        <input type="submit" value="Mostrar tabla (División)" />
    </form>
    <div id="tabla"></div>
</body>
</html>
